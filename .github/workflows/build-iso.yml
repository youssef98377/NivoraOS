name: Build Nivora OS ISO

# Manual button: GitHub -> Actions -> "Build Nivora OS ISO" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      skip_qemu:
        description: "Skip the virtual boot test (1 = skip, 0 = run it)"
        default: "0"

permissions:
  contents: write   # needed to publish the ISO as a Release (direct .iso download, no zip)

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folder (works with the full repo OR a single uploaded zip)
        run: |
          if [ -f scripts/build.sh ]; then
            echo "SRC_DIR=." >> "$GITHUB_ENV"
          else
            z=$(ls NivoraOS*.zip 2>/dev/null | head -1 || true)
            [ -n "$z" ] || { echo "No scripts/ folder and no NivoraOS*.zip found in the repo"; exit 1; }
            unzip -q "$z"
            echo "SRC_DIR=NivoraOS" >> "$GITHUB_ENV"
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xorriso squashfs-tools gpgv qemu-system-x86 imagemagick python3-pil

      - name: Unit tests (calculator)
        working-directory: ${{ env.SRC_DIR }}
        run: python3 tests/test_survey_calc.py

      - name: Build ISO (download -> verify hash -> customize -> repack -> verify -> QEMU)
        working-directory: ${{ env.SRC_DIR }}
        run: sudo SKIP_QEMU="${{ github.event.inputs.skip_qemu }}" ./scripts/build.sh

      # SMALL files first: you can check these on your phone before downloading 2 GB
      - name: Upload SMALL reports + screenshots (a few MB)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nivora-screenshots-and-reports
          path: |
            ${{ env.SRC_DIR }}/dist/qemu-screenshots/*
            ${{ env.SRC_DIR }}/dist/SCREENSHOT_ANALYSIS.txt
            ${{ env.SRC_DIR }}/dist/QEMU_RESULT.txt
            ${{ env.SRC_DIR }}/dist/VERIFY_REPORT.txt
            ${{ env.SRC_DIR }}/dist/BUILD_INFO.txt
            ${{ env.SRC_DIR }}/dist/PACKAGES.txt
            ${{ env.SRC_DIR }}/dist/SHA256SUMS
          retention-days: 30

      - name: Upload logs (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nivora-build-logs
          path: ${{ env.SRC_DIR }}/logs/*
          retention-days: 30

      # Direct .iso download (no zip). The ISO is just under the 2 GiB Release limit.
      - name: Publish ISO as a GitHub Release (direct download)
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ env.SRC_DIR }}
        run: |
          iso=$(ls dist/*.iso | head -1)
          tag="nivora-run-${{ github.run_number }}"
          gh release create "$tag" "$iso" dist/SHA256SUMS dist/BUILD_INFO.txt \
            --repo "${{ github.repository }}" \
            --title "Nivora OS build #${{ github.run_number }}" \
            --notes "Live USB image. NOT tested on real hardware. Verify SHA256SUMS before writing to USB."

      - name: Upload ISO as artifact (backup, zipped, large)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nivora-os-iso
          path: ${{ env.SRC_DIR }}/dist/*.iso
          retention-days: 14
          compression-level: 0
