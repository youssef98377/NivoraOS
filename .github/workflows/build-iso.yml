name: Build Nivora OS ISO

# Manual button: GitHub -> Actions -> "Build Nivora OS ISO" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      skip_qemu:
        description: "Skip the virtual boot test (1 = skip, 0 = run it)"
        default: "0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Find the project folder (works with the full repo OR a single uploaded zip)
        run: |
          if [ -f scripts/build.sh ]; then
            echo "SRC_DIR=." >> "$GITHUB_ENV"
          else
            z=$(ls NivoraOS*.zip 2>/dev/null | head -1 || true)
            [ -n "$z" ] || { echo "No scripts/ folder and no NivoraOS*.zip found in the repo"; exit 1; }
            unzip -q "$z"
            echo "SRC_DIR=NivoraOS" >> "$GITHUB_ENV"
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xorriso squashfs-tools gpgv qemu-system-x86 imagemagick

      - name: Unit tests (calculator)
        working-directory: ${{ env.SRC_DIR }}
        run: python3 tests/test_survey_calc.py

      - name: Build ISO (download -> verify hash -> customize -> repack -> verify)
        working-directory: ${{ env.SRC_DIR }}
        run: sudo SKIP_QEMU="${{ github.event.inputs.skip_qemu }}" ./scripts/build.sh

      - name: Upload ISO + checksums + reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nivora-os-iso
          path: |
            ${{ env.SRC_DIR }}/dist/*.iso
            ${{ env.SRC_DIR }}/dist/SHA256SUMS
            ${{ env.SRC_DIR }}/dist/BUILD_INFO.txt
            ${{ env.SRC_DIR }}/dist/PACKAGES.txt
            ${{ env.SRC_DIR }}/dist/VERIFY_REPORT.txt
            ${{ env.SRC_DIR }}/dist/QEMU_RESULT.txt
            ${{ env.SRC_DIR }}/dist/qemu-screenshots/*
          retention-days: 14
          compression-level: 0

      - name: Upload logs (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nivora-build-logs
          path: ${{ env.SRC_DIR }}/logs/*
          retention-days: 14
